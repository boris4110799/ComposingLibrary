[versions]
# Project
agp = "9.2.1"
kotlin = "2.3.0"
version = "0.1.0"

# Android
android-compileSdk = "37"
android-minSdk = "26"
android-camera = "1.5.0"
android-navigation3 = "1.1.3"

# CMP
cmp = "1.10.0"
cmp-animation = "1.10.0"
cmp-foundation = "1.10.0"
cmp-lifecycle = "2.10.0"
cmp-material3 = "1.9.0"
cmp-runtime = "1.10.0"
cmp-ui = "1.10.0"

# Kotlin
kotlin-coroutines = "1.10.2"
kotlin-datetime = "0.7.1"
kotlin-io = "0.9.0"
kotlin-serialization = "1.8.1"

# Test
junit = "4.13.2"

[libraries]
# Android
androidx-camera-core = { group = "androidx.camera", name = "camera-core", version.ref = "android-camera" }
androidx-camera-camera2 = { group = "androidx.camera", name = "camera-camera2", version.ref = "android-camera" }
androidx-camera-lifecycle = { group = "androidx.camera", name = "camera-lifecycle", version.ref = "android-camera" }
androidx-camera-compose = { group = "androidx.camera", name = "camera-compose", version.ref = "android-camera" }
androidx-navigation3-runtime = { group = "androidx.navigation3", name = "navigation3-runtime", version.ref = "android-navigation3" }
androidx-navigation3-ui = { group = "androidx.navigation3", name = "navigation3-ui", version.ref = "android-navigation3" }

# CMP
cmp-foundation = { group = "org.jetbrains.compose.foundation", name = "foundation", version.ref = "cmp-foundation" }
cmp-lifecycle-navigation3 = { group = "org.jetbrains.androidx.lifecycle", name = "lifecycle-viewmodel-navigation3", version.ref = "cmp-lifecycle" }
cmp-lifecycle-runtime = { group = "org.jetbrains.androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "cmp-lifecycle" }
cmp-lifecycle-viewmodel = { group = "org.jetbrains.androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "cmp-lifecycle" }
cmp-material3 = { group = "org.jetbrains.compose.material3", name = "material3", version.ref = "cmp-material3" }
cmp-runtime = { group = "org.jetbrains.compose.runtime", name = "runtime", version.ref = "cmp-runtime" }
cmp-ui = { group = "org.jetbrains.compose.ui", name = "ui", version.ref = "cmp-ui" }
cmp-ui-tooling = { group = "org.jetbrains.compose.ui", name = "ui-tooling", version.ref = "cmp-ui" }
cmp-ui-toolingPreview = { group = "org.jetbrains.compose.ui", name = "ui-tooling-preview", version.ref = "cmp-ui" }

# Kotlin
kotlinx-datetime = { group = "org.jetbrains.kotlinx", name = "kotlinx-datetime", version.ref = "kotlin-datetime" }
kotlinx-io = { group = "org.jetbrains.kotlinx", name = "kotlinx-io-core", version.ref = "kotlin-io" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlin-serialization" }

# Test
junit = { group = "junit", name = "junit", version.ref = "junit" }
kotlin-test = { group = "org.jetbrains.kotlin", name = "kotlin-test", version.ref = "kotlin" }
kotlin-testJunit = { group = "org.jetbrains.kotlin", name = "kotlin-test-junit", version.ref = "kotlin" }

# Gradle Plugin
android-gradle-plugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlin-multiplatform-gradle-plugin = { module = "org.jetbrains.kotlin.multiplatform:org.jetbrains.kotlin.multiplatform.gradle.plugin", version.ref = "kotlin" }
compose-multiplatform-gradle-plugin = { module = "org.jetbrains.compose:org.jetbrains.compose.gradle.plugin", version.ref = "cmp" }

[plugins]
# Android
androidMultiplatformLibrary = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }

# Kotlin
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }

# Compose
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "cmp" }

# Other
mavenPublish = { id = "maven-publish" }

# Convention
convention-composeMultiplatform = { id = "tw.boris4110799.composing.convention.multiplatformCompose" }
convention-multiplatformLibrary = { id = "tw.boris4110799.composing.convention.multiplatformLibrary" }
convention-mavenPublish = { id = "tw.boris4110799.composing.convention.multiplatformMavenPublish" }
